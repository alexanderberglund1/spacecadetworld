<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Space Cadet</title>
  <meta name="description" content="Space Cadet — Coming soon." />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }

    body{
      margin:0;
      min-height:100vh;
      display:grid;
      place-items:center;
      background:#05040a;
      color:#e7f7ff;
      font-family:"Press Start 2P", system-ui, sans-serif;
      image-rendering: pixelated;
    }

    body::before{
      content:"";
      position:fixed;
      inset:0;
      background:
        radial-gradient(#ffffff 1px, transparent 1px) 0 0 / 42px 42px,
        radial-gradient(#8bd3ff 1px, transparent 1px) 12px 18px / 64px 64px,
        radial-gradient(#bda7ff 1px, transparent 1px) 28px 6px / 88px 88px;
      opacity:0.18;
      pointer-events:none;
    }

    body::after{
      content:"";
      position:fixed;
      inset:0;
      background: linear-gradient(
        to bottom,
        rgba(255,255,255,0.05),
        rgba(255,255,255,0.05) 1px,
        rgba(0,0,0,0) 2px
      );
      background-size: 100% 3px;
      opacity:0.10;
      pointer-events:none;
      mix-blend-mode: overlay;
    }

    .wrap{ width:min(860px, 94vw); padding:22px; }

    .window{
      border:4px solid #e7f7ff;
      background:rgba(5,4,10,0.75);
      padding:18px;
    }

    .titlebar{
      display:flex;
      justify-content:space-between;
      padding:10px 12px;
      border:4px solid #e7f7ff;
      margin-bottom:14px;
    }

    .dots{ display:flex; gap:6px; }
    .dot{ width:12px; height:12px; border:2px solid #e7f7ff; }

    h1{ margin:0 0 10px; font-size:26px; }

    .soon{
      display:inline-block;
      padding:10px 12px;
      border:3px solid #8bd3ff;
      color:#8bd3ff;
      margin-bottom:18px;
    }

    .grid{
      display:grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap:18px;
    }

    @media (max-width:820px){
      .grid{ grid-template-columns:1fr; }
    }

    .panel{
      border:3px solid #e7f7ff;
      padding:14px;
      background:rgba(0,0,0,0.25);
    }

    h2{ margin:0 0 12px; font-size:14px; color:#bda7ff; }

    p{ font-size:12px; line-height:1.9; }

    label{ font-size:10px; margin:10px 0 6px; display:block; }

    input, textarea{
      width:100%;
      border:3px solid #e7f7ff;
      background:rgba(5,4,10,0.65);
      color:#e7f7ff;
      padding:10px;
      font-family:"Press Start 2P", sans-serif;
      font-size:10px;
    }

    textarea{ min-height:110px; }

    .btn{
      margin-top:12px;
      width:100%;
      border:3px solid #8bd3ff;
      background:rgba(139,211,255,0.14);
      color:#8bd3ff;
      padding:12px;
      font-family:"Press Start 2P", sans-serif;
      font-size:10px;
      cursor:pointer;
    }

    .footer{
      margin-top:14px;
      font-size:9px;
      opacity:0.7;
      display:flex;
      justify-content:space-between;
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="window">

      <div class="titlebar">
        <div>SPACE.CADET // TERMINAL</div>
        <div class="dots">
          <div class="dot"></div><div class="dot"></div><div class="dot"></div>
        </div>
      </div>

      <h1>Space Cadet</h1>
      <div class="soon">COMING SOON</div>

      <div class="grid">
        <div class="panel">
          <h2>Status</h2>
          <p>Systems online.</p>
          <p>Preparing launch sequence.</p>
          <p>Check back soon — or leave a message.</p>
        </div>

        <div class="panel">
          <h2>Contact us</h2>
          <form action="https://formspree.io/f/xjgbpgpv" method="POST">
            <label>NAME</label>
            <input name="name" required />

            <label>EMAIL</label>
            <input name="email" type="email" required />

            <label>MESSAGE</label>
            <textarea name="message" required></textarea>

            <button class="btn" type="submit">SEND</button>
          </form>
        </div>
      </div>

      <div class="footer">
        <div>© <span id="year"></span> SPACE CADET</div>
        <div>BUILD: v0.1</div>
      </div>

    </div>
  </div>

  <script>
    document.getElementById("year").textContent = new Date().getFullYear();
  </script>
</body>
</html>
